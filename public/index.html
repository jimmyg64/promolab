<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromoLab AI</title>
  <style>
    :root {
      --ink: #080d24;
      --muted: #5f6880;
      --line: #dfe3f4;
      --panel: #ffffff;
      --soft: #f3f5ff;
      --accent: #5146c6;
      --accent-dark: #352c99;
      --green: #d8fbe7;
      --green-text: #076238;
      --orange: #fff0dc;
      --orange-text: #8c4b00;
      --shadow: 0 18px 45px rgba(18, 24, 54, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef1fb;
      color: var(--ink);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      background: var(--ink);
      color: #fff;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 34px;
      gap: 18px;
    }

    .brand {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .brand span {
      color: #887cff;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav a {
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      padding: 11px 16px;
      font-weight: 800;
      color: #fff;
    }

    .nav .primary {
      background: #fff;
      color: var(--accent-dark);
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 34px 22px 54px;
    }

    .hero {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      min-height: 330px;
    }
