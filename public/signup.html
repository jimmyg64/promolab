<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — PromoLab</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#F0F0F8;color:#1A1A2E;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:12px;padding:40px;max-width:420px;width:100%;box-shadow:0 2px 12px rgba(0,0,0,0.07)}
.eyebrow{font-size:11px;color:#4F46B8;text-transform:uppercase;letter-spacing:0.06em;font-weight:700;margin-bottom:8px}
h1{font-size:22px;font-weight:700;margin-bottom:6px}
.sub{font-size:13px;color:#888;margin-bottom:24px}
label{font-size:13px;color:#555;display:block;margin-bottom:4px;font-weight:700}
input{width:100%;padding:10px 14px;border:1px solid #D0CFEE;border-radius:7px;font-size:14px;margin-bottom:14px;font-family:Arial,sans-serif}
input:focus{outline:none;border-color:#4F46B8}
.btn{width:100%;background:#4F46B8;color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s}
.btn:hover{background:#3C3489}
.alert{padding:10px 14px;border-radius:7px;font-size:13px;margin-bottom:14px;font-weight:700;display:none}
.alert-error{background:#FCEBEB;color:#7A1010}
.alert-success{background:#EAF3DE;color:#1D6A3A}
.footer{text-align:center;margin-top:20px;font-size:13px;color:#888}
.footer a{color:#4F46B8;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <p class="eyebrow">PromoLab</p>
  <h1>Create your account</h1>
  <p class="sub">Sign up after purchasing PromoLab access.</p>
  <div id="alert" class="alert"></div>
  <label>Email address</label>
  <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
  <label>Password</label>
  <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password">
  <label>Confirm password</label>
  <input type="password" id="confirm" placeholder="Repeat your password" autocomplete="new-password">
  <button class="btn" onclick="signup()">Create account</button>
  <div class="footer">
    <p>Already have an account? <a href="/login.html">Log in</a></p>
    <p style="margin-top:8px"><a href="/">Back to home</a></p>
  </div>
</div>
<script>
async function signup(){
  var email=document.getElementById('email').value.trim();
  var password=document.getElementById('password').value;
  var confirm=document.getElementById('confirm').value;
  if(!email||!password){showAlert('Please fill in all fields.','error');return;}
  if(password!==confirm){showAlert('Passwords do not match.','error');return;}
  if(password.length<8){showAlert('Password must be at least 8 characters.','error');return;}
  try{
    var res=await fetch('/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    var data=await res.json();
    if(data.success){showAlert('Account created! Check your email to confirm, then log in.','success');}
    else{showAlert(data.message||'Signup failed','error');}
  }catch(e){showAlert('Network error. Please try again.','error');}
}
function showAlert(msg,type){
  var el=document.getElementById('alert');
  el.textContent=msg;
  el.className='alert alert-'+type;
  el.style.display='block';
}
</script>
</body>
</html>
